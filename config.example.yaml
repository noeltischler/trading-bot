# Kopiere diese Datei nach config.yaml und passe sie an.

# Börse, von der die Live-Kurse kommen (öffentliche Daten, kein Konto nötig).
# Gehandelt wird NUR auf dem Übungskonto des Bots, nie mit echtem Geld.
exchange: kraken

# Börse für den langen Kursverlauf im Backtest. Kraken liefert nur die letzten
# 720 Kerzen (bei 15m gut 7 Tage), Coinbase dagegen Monate.
history_exchange: coinbaseexchange

# Coins, die der Bot beobachtet. Links der Name im Bot, rechts das Börsensymbol.
symbols:
  BTC: BTC/USD
  ETH: ETH/USD
  SOL: SOL/USD

# Kerzen-Zeitrahmen: 1m, 5m, 15m, 30m, 1h, 4h, 1d
timeframe: 15m

# Wie viele Tage Kursverlauf 'fetch' für den Backtest lädt
history_days: 90

# Übungskonto
start_equity: 10000          # Spielgeld in USD
fee_pct: 0.1                 # Kosten pro Kauf bzw. Verkauf in % (Gebühr + Spread)

# Risikoregeln
risk:
  risk_per_trade_pct: 0.75   # 0,5 bis 1 % des Kontos pro Trade
  stop_pct: 1.0              # Anfangs-Stop-Loss: Abstand zum Einstieg in %
  trailing_stop_pct: 1.0     # Abstand des nachgezogenen Stop-Loss in %
  max_open_positions: 3

# Strategie (Trendfolge). Nur ändern, wenn du weißt, was du tust.
strategy:
  fast: 20
  slow: 50
  trend: 200
  allow_short: true

# Speicherorte
database: data/market.db     # Kursdaten für den Backtest
paper_database: data/paper.db  # Übungskonto, Positionen und Trades
