# Empfohlene Einstellungen (Stand 22.10.2026), ausgewählt mit 'optimize' auf
# 1 Jahr Kursdaten, 8 Coins, Kosten 0,1 % pro Seite:
#   Keil 80 + Sweep 50, 4h, Stop 3 %, Trail 3 %
#   Training (erste 2/3):  -0,2 %   (nur Keil: -10,6 %)
#   Test (letztes 1/3):   +15,0 %   (nur Keil: +14,3 %), PF 1,27, 7 von 8 Coins im Plus
#   etwa 1,6 Trades pro Tag
# Kein Versprechen für die Zukunft. Übernehmen:  cp config.empfohlen.yaml config.yaml

exchange: kraken
history_exchange: coinbaseexchange

symbols:
  BTC: BTC/USD
  ETH: ETH/USD
  SOL: SOL/USD
  XRP: XRP/USD
  DOGE: DOGE/USD
  ADA: ADA/USD
  LINK: LINK/USD
  AVAX: AVAX/USD

timeframe: 4h
history_days: 365

start_equity: 10000
fee_pct: 0.1

risk:
  risk_per_trade_pct: 0.75   # 0,75 % des Kontos pro Trade
  stop_pct: 3.0              # Anfangs-Stop 3 % vom Einstieg
  trailing_stop_pct: 3.0     # Stop wird 3 % hinter dem besten Kurs nachgezogen
  max_open_positions: 8
  # Sicherheitsregeln
  max_position_pct: 25       # eine Position höchstens 25 % vom Konto
  daily_loss_limit_pct: 3    # nach 3 % Tagesverlust keine neuen Trades bis Mitternacht (UTC)
  drawdown_brake_pct: 10     # 10 % unter Höchststand: Risiko pro Trade halbieren

# Zwei Strategien zusammen. Haben beide auf derselben Kerze ein Signal, zählt die erste.
strategy:
  - kind: wedge              # Keil-/Dreieck-Ausbruch (deine Idee)
    lookback: 80
  - kind: sweep              # Liquiditäts-Sweep: Tief/Hoch der letzten 50 Kerzen
    lookback: 50             # wird kurz durchstoßen, Schluss wieder zurück
    use_trend: true

database: data/market.db
paper_database: data/paper.db
